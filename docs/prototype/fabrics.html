<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drapeworks CRM — Fabric Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-white border-b border-slate-200" x-data="{ navOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4 md:gap-8">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded bg-teal-600 flex items-center justify-center text-white font-bold">D</div>
          <span class="font-semibold text-slate-900 text-sm sm:text-base">Drapeworks CRM</span>
        </a>
        <div class="hidden md:flex items-center gap-1 text-sm">
          <a href="index.html" class="px-3 py-1.5 rounded text-slate-600 hover:bg-slate-100">Orders</a>
          <a href="consultation.html" class="px-3 py-1.5 rounded text-slate-600 hover:bg-slate-100">New Consultation</a>
          <a href="fabrics.html" class="px-3 py-1.5 rounded bg-slate-100 text-slate-900 font-medium">Fabrics</a>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-3 text-sm">
        <span class="hidden sm:inline text-slate-500">Sarah Lim</span>
        <div class="w-8 h-8 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-xs font-semibold">SL</div>
        <button @click="navOpen = !navOpen" class="md:hidden p-1.5 text-slate-600 hover:bg-slate-100 rounded" aria-label="Menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
    <div x-show="navOpen" x-cloak class="md:hidden border-t border-slate-200 px-4 py-2 space-y-1">
      <a href="index.html" class="block px-3 py-2 rounded text-slate-600 hover:bg-slate-100 text-sm">Orders</a>
      <a href="consultation.html" class="block px-3 py-2 rounded text-slate-600 hover:bg-slate-100 text-sm">New Consultation</a>
      <a href="fabrics.html" class="block px-3 py-2 rounded bg-slate-100 text-slate-900 font-medium text-sm">Fabrics</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8" x-data="fabricsPage()">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Fabric Catalog</h1>
        <p class="text-sm text-slate-500 mt-1">Manage the curtain codes consultants can select from</p>
      </div>
      <button @click="openAdd()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded font-medium text-sm">+ Add fabric</button>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-lg border border-slate-200 mb-4 p-3 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
      <input type="text" x-model="search" placeholder="Search by code or name" class="flex-1 px-3 py-2 border border-slate-200 rounded text-sm focus:outline-none focus:border-teal-500" />
      <div class="grid grid-cols-2 sm:flex gap-2 sm:gap-3">
        <select x-model="filterType" class="px-3 py-2 border border-slate-200 rounded text-sm">
          <option value="">All types</option>
          <option>Day</option>
          <option>Night</option>
          <option>Both</option>
        </select>
        <select x-model="filterStatus" class="px-3 py-2 border border-slate-200 rounded text-sm">
          <option value="">All statuses</option>
          <option>Active</option>
          <option>Discontinued</option>
        </select>
      </div>
    </div>

    <!-- Table (md+) -->
    <div class="hidden md:block bg-white rounded-lg border border-slate-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600">
          <tr>
            <th class="text-left px-4 py-3 font-medium w-16">Preview</th>
            <th class="text-left px-4 py-3 font-medium">Code</th>
            <th class="text-left px-4 py-3 font-medium">Name</th>
            <th class="text-left px-4 py-3 font-medium">Type</th>
            <th class="text-left px-4 py-3 font-medium">Supplier</th>
            <th class="text-left px-4 py-3 font-medium">Status</th>
            <th class="text-right px-4 py-3 font-medium">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <template x-for="f in filtered()" :key="f.code">
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-3">
                <div class="w-10 h-10 rounded border border-slate-200" :style="'background:' + f.color"></div>
              </td>
              <td class="px-4 py-3 font-mono text-xs text-slate-700" x-text="f.code"></td>
              <td class="px-4 py-3 font-medium text-slate-900" x-text="f.name"></td>
              <td class="px-4 py-3">
                <span class="inline-block px-2 py-0.5 rounded text-xs font-medium"
                  :class="f.type==='Day'?'bg-teal-100 text-teal-700':(f.type==='Night'?'bg-indigo-100 text-indigo-700':'bg-slate-200 text-slate-700')"
                  x-text="f.type"></span>
              </td>
              <td class="px-4 py-3 text-slate-600" x-text="f.supplier"></td>
              <td class="px-4 py-3">
                <span class="inline-block px-2 py-0.5 rounded text-xs font-medium"
                  :class="f.status==='Active'?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-600'"
                  x-text="f.status"></span>
              </td>
              <td class="px-4 py-3 text-right">
                <button @click="edit(f)" class="text-xs text-slate-600 hover:text-teal-700 mr-3">Edit</button>
                <button @click="toggleStatus(f)" class="text-xs text-slate-600 hover:text-red-600" x-text="f.status==='Active'?'Discontinue':'Reactivate'"></button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <div x-show="filtered().length === 0" class="text-center py-12 text-sm text-slate-500">No fabrics match your filters.</div>
    </div>

    <!-- Cards (mobile) -->
    <div class="md:hidden space-y-3">
      <template x-for="f in filtered()" :key="f.code">
        <div class="bg-white rounded-lg border border-slate-200 p-3 flex items-start gap-3">
          <div class="w-12 h-12 rounded border border-slate-200 flex-shrink-0" :style="'background:' + f.color"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="font-medium text-slate-900 truncate" x-text="f.name"></div>
                <div class="font-mono text-xs text-slate-500" x-text="f.code"></div>
              </div>
              <div class="flex flex-col items-end gap-1 flex-shrink-0">
                <span class="inline-block px-2 py-0.5 rounded text-xs font-medium"
                  :class="f.type==='Day'?'bg-teal-100 text-teal-700':(f.type==='Night'?'bg-indigo-100 text-indigo-700':'bg-slate-200 text-slate-700')"
                  x-text="f.type"></span>
                <span class="inline-block px-2 py-0.5 rounded text-xs font-medium"
                  :class="f.status==='Active'?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-600'"
                  x-text="f.status"></span>
              </div>
            </div>
            <div class="text-xs text-slate-500 mt-1" x-text="f.supplier"></div>
            <div class="flex items-center gap-3 mt-2 pt-2 border-t border-slate-100">
              <button @click="edit(f)" class="text-xs text-teal-700 font-medium">Edit</button>
              <button @click="toggleStatus(f)" class="text-xs text-slate-600" x-text="f.status==='Active'?'Discontinue':'Reactivate'"></button>
            </div>
          </div>
        </div>
      </template>
      <div x-show="filtered().length === 0" class="text-center py-12 text-sm text-slate-500">No fabrics match your filters.</div>
    </div>

    <!-- Modal -->
    <div x-show="modalOpen" x-cloak class="fixed inset-0 bg-slate-900/40 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4" @click.self="modalOpen=false">
      <div class="bg-white rounded-t-lg sm:rounded-lg shadow-xl w-full max-w-lg p-5 sm:p-6 max-h-[90vh] overflow-y-auto">
        <h3 class="text-lg font-semibold text-slate-900 mb-4" x-text="editing.isNew ? 'Add fabric' : 'Edit fabric'"></h3>
        <div class="space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Code</label>
              <input type="text" x-model="editing.code" class="w-full px-3 py-2 border border-slate-200 rounded text-sm focus:outline-none focus:border-teal-500" placeholder="DW-D-120" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Type</label>
              <select x-model="editing.type" class="w-full px-3 py-2 border border-slate-200 rounded text-sm focus:outline-none focus:border-teal-500">
                <option>Day</option>
                <option>Night</option>
                <option>Both</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Name</label>
            <input type="text" x-model="editing.name" class="w-full px-3 py-2 border border-slate-200 rounded text-sm focus:outline-none focus:border-teal-500" placeholder="e.g. Linen Sheer Ivory" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Supplier</label>
              <input type="text" x-model="editing.supplier" class="w-full px-3 py-2 border border-slate-200 rounded text-sm focus:outline-none focus:border-teal-500" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Swatch colour</label>
              <input type="color" x-model="editing.color" class="w-full h-9 px-1 py-1 border border-slate-200 rounded" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Notes</label>
            <textarea x-model="editing.notes" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded text-sm focus:outline-none focus:border-teal-500" placeholder="e.g. lead time 3 weeks, min order 5m..."></textarea>
          </div>
        </div>
        <div class="flex items-center justify-end gap-2 mt-5">
          <button @click="modalOpen=false" class="px-3 py-1.5 text-sm text-slate-600">Cancel</button>
          <button @click="save()" class="px-4 py-1.5 text-sm bg-teal-600 hover:bg-teal-700 text-white rounded font-medium">Save</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function fabricsPage() {
      return {
        search: '',
        filterType: '',
        filterStatus: '',
        modalOpen: false,
        editing: {},
        fabrics: [
          { code: 'DW-D-101', name: 'Linen Sheer Ivory', type: 'Day', supplier: 'Textura SG', color: '#f5ecd9', status: 'Active', notes: '' },
          { code: 'DW-D-102', name: 'Cotton Sheer White', type: 'Day', supplier: 'Textura SG', color: '#fafafa', status: 'Active', notes: '' },
          { code: 'DW-D-115', name: 'Voile Champagne', type: 'Day', supplier: 'KH Fabrics', color: '#e8d9b8', status: 'Active', notes: 'Lead time 3 weeks' },
          { code: 'DW-N-201', name: 'Velvet Blackout Charcoal', type: 'Night', supplier: 'KH Fabrics', color: '#3a3a3a', status: 'Active', notes: '' },
          { code: 'DW-N-202', name: 'Cotton Blackout Beige', type: 'Night', supplier: 'Textura SG', color: '#d4c2a0', status: 'Active', notes: '' },
          { code: 'DW-N-210', name: 'Dimout Navy', type: 'Night', supplier: 'Asia Drapery', color: '#1e2b4a', status: 'Active', notes: '' },
          { code: 'DW-N-220', name: 'Suede Blackout Olive', type: 'Night', supplier: 'KH Fabrics', color: '#5a5d3a', status: 'Discontinued', notes: 'Replaced by DW-N-225' },
          { code: 'DW-T-301', name: 'Waterproof Roller White', type: 'Both', supplier: 'Rollco', color: '#f3f3f3', status: 'Active', notes: 'For wet areas' },
          { code: 'DW-T-302', name: 'PVC Roller Grey', type: 'Both', supplier: 'Rollco', color: '#9aa0a6', status: 'Active', notes: '' },
        ],
        filtered() {
          const q = this.search.toLowerCase();
          return this.fabrics.filter(f =>
            (!q || f.code.toLowerCase().includes(q) || f.name.toLowerCase().includes(q)) &&
            (!this.filterType || f.type === this.filterType) &&
            (!this.filterStatus || f.status === this.filterStatus)
          );
        },
        openAdd() {
          this.editing = { isNew: true, code: '', name: '', type: 'Day', supplier: '', color: '#eeeeee', status: 'Active', notes: '' };
          this.modalOpen = true;
        },
        edit(f) {
          this.editing = { isNew: false, ...f };
          this.modalOpen = true;
        },
        save() {
          if (this.editing.isNew) {
            const { isNew, ...rest } = this.editing;
            this.fabrics.unshift(rest);
          } else {
            const i = this.fabrics.findIndex(x => x.code === this.editing.code);
            if (i >= 0) {
              const { isNew, ...rest } = this.editing;
              this.fabrics[i] = rest;
            }
          }
          this.modalOpen = false;
        },
        toggleStatus(f) {
          f.status = f.status === 'Active' ? 'Discontinued' : 'Active';
        }
      }
    }
  </script>
</body>
</html>
